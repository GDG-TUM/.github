
name: Update organization profile

on:
  schedule:
    # Run hourly; theme selection uses Africa/Nairobi local date.
    - cron: "0 * * * *"

  push:
    paths:
      - "data/events.yml"
      - "scripts/update_events.py"
      - "scripts/theme_readme.py"
      - ".github/workflows/update-events.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Update events
        run: python scripts/update_events.py

      - name: Apply seasonal README theme
        run: python scripts/theme_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.yml profile/README.md
          git commit -m "chore: update organization profile"
          git push
